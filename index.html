#field.bamboo{background:repeating-linear-gradient(90deg,transparent 0 46px,#5aa84a 46px 58px,transparent 58px 120px),linear-gradient(#a8dc8a 0 52%,#6fa85a 52% 100%)}

@keyframes lgRyu{0%{background:#000;opacity:1}12%{background:#fff7c0;opacity:1}18%{background:#000;opacity:.9}30%{background:#fffbe0;opacity:1}60%{background:#1b45a0;opacity:.6}100%{opacity:0}}
@keyframes lgTora{0%{background:#000;opacity:1}25%{background:#e8ffe0;opacity:1}45%{background:#2f6a2c;opacity:.7}70%{background:#fff;opacity:.5}100%{opacity:0}}
@keyframes lgSr{0%{background:#fff;opacity:0}30%{background:linear-gradient(120deg,#ff9ac8,#ffe98a,#9ff0ff,#c9a8ff);opacity:1}100%{opacity:0}}
.bpos{position:absolute;display:flex;flex-direction:column;align-items:center}

#e-pos{right:10%;top:7%}
#m-pos{left:8%;bottom:4%}

#m-info{right:4%;bottom:12%}

.blv{font-weight:bold;margin-left:auto}
.hp{display:flex;align-items:center;gap:8px;margin-top:4px}

#bpanel{flex:none;padding:10px;display:flex;flex-direction:column;gap:10px}
#bcmd{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,2),1fr);min-height:130px;align-content:start}
.spr.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:translateX(0);opacity:1}20%{transform:translateX(-12px);opacity:.25}40%{transform:translateX(12px);opacity:1}60%{transform:translateX(-7px);opacity:.25}80%{transform:translateX(7px);opacity:1}}
.spr.lunge-r{animation:lunger .35s}
@keyframes lunger{50%{transform:translate(40px,-24px)}}
.spr.lunge-l{animation:lungel .35s}

.spr.enter{animation:enter .55s ease-out}

#ball{position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;background:linear-gradient(#e53935 0 45%,#222 45% 55%,#fff 55%);border:3px solid #222;display:none;z-index:6}

.star{position:absolute;font-size:28px;pointer-events:none;z-index:7;animation:star .9s ease-out forwards}

</style>

<script>
'use strict';
/* =====================================================================
   タイプ
   ===================================================================== */
const TYPES = {
  'くさ':    {c:'#3fa34d', deco:'🌱'},
  'みず':    {c:'#2b84d6', deco:'💧'},
  'ほのお':  {c:'#ec5b2a', deco:'🔥'},
  'つち':    {c:'#9a6a3c', deco:'⛰️'},
  'きんぞく':{c:'#6f87a6', deco:'⚙️'},
  'ひと':    {c:'#5b6bc0', deco:'✋'},
  'ことば':  {c:'#8e5cc8', deco:'💬'},
  'こころ':  {c:'#e0508f', deco:'💗'},
  'からだ':  {c:'#1fa39a', deco:'💪'},
  'いきもの':{c:'#8bb33a', deco:'🐾'},
  'くらし':  {c:'#d9822b', deco:'🏠'},
  'ひかり':  {c:'#e2b100', deco:'⭐', light:true},
  'もじ':    {c:'#7c7c8a', deco:'✏️'},
};
/* つよい あいて(2ばい)・にがてな あいて(0.5ばい) */
const EFF = {
  'みず':    {'ほのお':2,'つち':2,'くさ':.5},
  'ほのお':  {'くさ':2,'きんぞく':2,'みず':.5,'つち':.5},
  'くさ':    {'みず':2,'つち':2,'ほのお':.5,'きんぞく':.5},
  'つち':    {'ほのお':2,'きんぞく':2,'くさ':.5},
  'きんぞく':{'くさ':2,'くらし':2,'ほのお':.5},
  'いきもの':{'くさ':2},
  'からだ':  {'いきもの':2},
  'ひと':    {'ことば':2,'くらし':2},
  'ことば':  {'こころ':2,'もじ':2},
  'こころ':  {'ひと':2,'からだ':2},
  'くらし':  {'みず':2},
  'ひかり':  {'こころ':2},
  'もじ':    {},
};
const EFF_WHY = {
  'みず':'みずは ひを けす','ほのお':'ひは きを もやす','くさ':'くさは みずと つちで そだつ','つち':'つちは ひを うめる',
  'きんぞく':'はさみは くさを きる','いきもの':'いきものは くさを たべる','からだ':'からだを うごかして つかまえる',
  'ひと':'ひとは ことばを つかう','ことば':'ことばは こころに とどく','こころ':'こころが からだを うごかす',
  'くらし':'いえは あめを ふせぐ','ひかり':'ひかりは こころを てらす','もじ':'どの タイプにも ふつう',
};
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+p))));return '#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');}
for(const t in TYPES) TYPES[t].c2 = shade(TYPES[t].c,-0.28);

/* =====================================================================
   データの よみこみ
   ===================================================================== */
const SP = {}, SPL = [];
RAW.trim().split('\n').forEach(line=>{
  const f=line.split('|');
  const [k,yomi,g,type,st,on,kun,mv,desc]=f, opt=f[9]||'';
  const s={k,yomi,g:+g,type,st:+st,on,kun,desc,stage:1};
  const mvs=mv.split(',').map(p=>{const [w,r,c]=p.split(':');return c?{w,r,c}:{w,r};});
  s.moves=mvs.slice(0,2).map((m,i)=>({...m,pow:i?60:45}));
  s.sps=mvs.slice(2).map(m=>({...m,pow:90,sp:true})); // ひっさつわざ（じゅんばんに おぼえる）
  opt.split(';').filter(Boolean).forEach(o=>{ const [a,b]=o.split('='); if(a==='evo'){const [to,lv]=b.split(':'); s.evo={to,lv:+lv};} if(a==='stage') s.stage=+b; if(a==='sr') s.sr=true; if(a==='leg') s.leg=true; if(a==='pw') s.pw=+b; });
  s.extra = (s.sr||s.leg) && s.g>3; // がくねんの かずに いれない とくべつな かんじ
  const gp = s.pw||s.g;
  const sb=s.stage-1;
  s.bHP  = 32 + s.st*2 + sb*14 + (type==='みず'?8:0) + (type==='くさ'?4:0);
  s.bAtk = 42 + gp*5 + sb*14 + (type==='ほのお'?8:0);
  s.bDef = 40 + gp*4 + sb*12 + (type==='つち'||type==='きんぞく'?10:0);
  if(!TYPES[type]) console.warn('タイプが ちがう:', line);
  SP[k]=s; SPL.push(s);
});
SPL.sort((a,b)=>a.g-b.g);
const ALLYOMI = SPL.map(s=>s.yomi);
const ALLWORDS = SPL.flatMap(s=>[...s.moves,...s.sps].map(m=>m.r));
const Y = k => SP[k] ? SP[k].yomi : k;
const MEAN = {};
(typeof MEANS==='string'?MEANS:'').trim().split('\n').forEach(l=>{ const i=l.indexOf(':'); if(i>0) MEAN[l.slice(0,i).trim()]=l.slice(i+1).trim(); });
const ALLW = [...new Set(SPL.flatMap(s=>[...s.moves,...s.sps].map(m=>m.w)))];
const W2R = {}; SPL.forEach(s=>[...s.moves,...s.sps].forEach(m=>W2R[m.w]=m.r));
/* さいごの ひっさつわざ（四字熟語・ことわざ・故事成語・慣用句）の しゅるい */
const W2C = {}; SPL.forEach(s=>s.sps.forEach(m=>{ if(m.c) W2C[m.w]=m.c; }));
const spMark = v => W2C[v.w] ? '🌟 ' : v.sp ? '⭐ ' : '';
const catTag = v => W2C[v.w] ? `<span class="cattag">${W2C[v.w]}</span>` : '';
const FIN_POW = 75; // さいごの ひっさつわざを おぼえた あとの いりょく
/* すがた：しんかする かんじは だんかいごとに かわる。しんかも がったいも しない かんじは レア */
const PRE = {}; SPL.forEach(s=>{ if(s.evo) PRE[s.evo.to]=s.k; });
const FUSE = new Set(RECIPES.flat());
SPL.forEach(s=>{ let d=0,k=s.k; while(PRE[k]&&d<5){ d++; k=PRE[k]; }
  s.depth=d; s.line=!!(s.evo||PRE[s.k]); s.rare=!s.line&&!FUSE.has(s.k)&&!s.sr&&!s.leg; s.rv=s.k.charCodeAt(0)%4;
  s.form = s.rare ? `rare r${s.rv}` : s.line ? `ev${Math.min(d,2)}` : ''; });
const k2h = s => s.replace(/[ァ-ヶ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
function validReadings(s){ return [s.yomi, ...s.on.split('・').map(k2h), ...s.kun.split('・')].filter(x=>x && x!=='—'); }
for(const id in MAPS){ const m=MAPS[id]; m.id=id; m.w=m.rows[0].length; m.h=m.rows.length; }

/* =====================================================================
   ほぞん
   ===================================================================== */
const SAVE_KEY='kanjimon_save_v1', SET_KEY='kanjimon_settings_v1', REC_KEY='kanjimon_record_v1';
const store = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const QTL = [['yomi','📖 よみ','読み（熟語の読み）'],['imi','💡 いみ','いみ（ことばの意味）'],['kaku','✏️ かくすう','かくすう（漢字の画数）'],['kotoba','🔍 かんじ','かんじ（読みから熟語をえらぶ）'],['ana','🧩 あなうめ','あなうめ（□に入る漢字）'],['bushu','🧱 ぶしゅ','ぶしゅ（漢字の部首）']];
const DEF_SET = {maxArea:6, autoSpeak:true, sfx:true, bgm:2, bgmLast:2, textSpeed:'normal', moveQuiz:true, qTypes:QTL.map(q=>q[0]), guardQuiz:true};
let S = Object.assign({}, DEF_SET, store.get(SET_KEY)||{});
if(!S.buQ){ S.buQ=1; if(Array.isArray(S.qTypes)&&!S.qTypes.includes('bushu')) S.qTypes.push('bushu'); }
let REC = store.get(REC_KEY) || {k:{}, w:{}};
let G = null;
const START = {map:'mura', x:5, y:7};
function newGame(){ return {v:2, map:START.map, x:START.x, y:START.y, dir:'d', party:[], box:[], dex:{}, badges:0, nextId:1,
  money:500, items:{ball:5, sball:0, potion:2, spotion:0, revive:0}, flags:{}, beaten:{}, chests:{}, gates:{}, visited:{},
  respawn:{map:'mura', x:15, y:6}}; }
function save(){ if(G) store.set(SAVE_KEY,G); }
function saveSet(){ store.set(SET_KEY,S); }
/* まえの ばんの カンジモンを いまの カンジモンに おきかえる（綾 → 彩） */
const RENAMED = {'綾':'彩'};
function renameOld(g){
  for(const m of [...(g.party||[]),...(g.box||[])]) if(m && RENAMED[m.k]){ m.k=RENAMED[m.k]; delete m.mv; m.eq=[]; m.used=[]; }
  if(g.dex) for(const a in RENAMED) if(g.dex[a]){ g.dex[RENAMED[a]]=Math.max(g.dex[RENAMED[a]]||0,g.dex[a]); delete g.dex[a]; }
  if(g.flags) for(const a in RENAMED) if(g.flags['sr_'+a]){ g.flags['sr_'+RENAMED[a]]=true; delete g.flags['sr_'+a]; }
}
function loadGame(){
  let g=store.get(SAVE_KEY); if(!g||!Array.isArray(g.party)) return null;
  renameOld(g);
  const ok=m=>m&&SP[m.k];
  if(!g.v || g.v<2){ // しさくばんの データを ひきつぐ
    const n=newGame(); n.party=g.party.filter(ok); n.box=(g.box||[]).filter(ok); n.dex=g.dex||{}; n.nextId=g.nextId||100; g=n;
  }
  g.party=g.party.filter(ok); g.box=(g.box||[]).filter(ok); if(!g.party.length) return null;
  [...g.party,...g.box].forEach(normMon);
  const d=newGame(); for(const k in d) if(g[k]===undefined) g[k]=d[k];
  for(const k in d.items) if(g.items[k]===undefined) g.items[k]=0;
  if(!MAPS[g.map]){ g.map=START.map; g.x=START.x; g.y=START.y; }
  for(let i=1;i<=g.badges;i++) g.flags['badge'+i]=true;
  if(g.beaten&&g.beaten.boss2){ g.flags.boss2=true; g.flags.gym2open=true; }
  if(g.beaten&&g.beaten.boss3){ g.flags.boss3=true; g.flags.gym3open=true; }
  return g;
}
function rec(kind,key,ok){ const t=REC[kind]=REC[kind]||{}; t[key]=t[key]||[0,0]; t[key][ok?0:1]++; store.set(REC_KEY,REC); }

/* =====================================================================
   つよさ
   ===================================================================== */
function st(m){ const s=SP[m.k], L=m.lv; return {hp:Math.floor(s.bHP*2*L/100)+L+10, atk:Math.floor(s.bAtk*2*L/100)+5, def:Math.floor(s.bDef*2*L/100)+5}; }
function mkW(k,lv){ const m={k,lv,exp:0,hp:0}; m.hp=st(m).hp; return m; }
function mkOwn(k,lv){ const m=mkW(k,lv); m.id=G.nextId++; return normMon(m); }
const needExp = L => 3 + L*2;
const SP_POW = 60;  // おぼえた ひっさつわざの いりょく（さいしょの わざは 45・60）
const MAX_EQ = 3;   // バトルで つかえる わざの かず
// m.mv … おぼえた わざ ぜんぶ ／ m.eq … バトルで つかう わざ（さいだい 3つ）／ m.used … つぎの ひっさつわざに むけて つかった わざ
function normMon(m){
  if(!m.mv){
    m.mv=SP[m.k].moves.map(v=>({w:v.w,r:v.r,pow:v.pow}));
    (m.learn||[]).forEach(w=>{ const v=SPL.flatMap(x=>x.sps).find(x=>x.w===w); if(v && !m.mv.some(x=>x.w===w)) m.mv.push({w:v.w,r:v.r,pow:W2C[v.w]?FIN_POW:SP_POW,sp:true}); });
  }
  m.eq=(m.eq||[]).filter(w=>m.mv.some(v=>v.w===w)).slice(0,MAX_EQ);
  if(!m.eq.length) m.eq=m.mv.slice(0,MAX_EQ).map(v=>v.w);
  if(!Array.isArray(m.used)) m.used=[];
  delete m.learn;
  return m;
}
const eqMoves = m => m.eq.map(w=>m.mv.find(v=>v.w===w)).filter(Boolean);
const nextSp = m => SP[m.k].sps.find(v=>!m.mv.some(x=>x.w===v.w)) || null;
const spLeft = m => { const u=new Set(m.used); return eqMoves(m).filter(v=>!u.has(v.w)).length; };

  const nb=a.createBuffer(1, a.sampleRate*0.5, a.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; MUS.noise=nb;
  return MUS.bus;
}
function hz(m){ return 440*Math.pow(2,(m-69)/12); }
function musNote(a, out, ev, t, dur, wave){
  if(ev.c==='k'||ev.c==='s'||ev.c==='h'){
    const g=a.createGain(); g.connect(out);
    if(ev.c==='k'){ const o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(48,t+.12);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.14); o.connect(g); o.start(t); o.stop(t+.16); return; }
    const src=a.createBufferSource(), f=a.createBiquadFilter(); src.buffer=MUS.noise;
    if(ev.c==='s'){ f.type='bandpass'; f.frequency.value=1800; g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.0001,t+.1); }
    else { f.type='highpass'; f.frequency.value=6000; g.gain.setValueAtTime(.03,t); g.gain.exponentialRampToValueAtTime(.0001,t+.035); }
    src.connect(f); f.connect(g); src.start(t); src.stop(t+.12); return;
  }
  const o=a.createOscillator(), g=a.createGain();
  let type='triangle', vol=.09, pluck=false;
  if(ev.c==='mel'){ if(wave==='square'){ type='square'; vol=.032; } else if(wave==='pluck'){ pluck=true; vol=.11; } else vol=.085; }
  else if(ev.c==='arp'){ type='triangle'; vol=.035; }
  o.type=type; o.frequency.setValueAtTime(hz(ev.m),t);
  const end=t+Math.max(.06,dur*.92);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
  if(pluck||ev.c==='arp'){ g.gain.exponentialRampToValueAtTime(.0001, t+Math.min(dur*1.1, pluck?.9:.5)+.02); o.start(t); o.stop(t+Math.min(dur*1.1,.9)+.05); }
  else { g.gain.setValueAtTime(vol,Math.max(t+.013,end-.03)); g.gain.linearRampToValueAtTime(0,end); o.start(t); o.stop(end+.02); }

}
function musStop(){
  const c=MUS.cur; MUS.cur=null; if(!c||!AC) return;

let jaVoice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/ja/i.test(v.lang)); jaVoice = vs.find(v=>/Nanami|Haruka|Ayumi|Sayaka|Kyoko|O-ren/i.test(v.name)) || vs[0] || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function cleanSpeech(t){ return String(t).replace(/^[^\n]{1,40}：\s*\n/,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/Lv\s?/g,'レベル ').replace(/[「」『』（）()□]/g,' ').replace(/…/g,'、').replace(/：/g,'。').replace(/[←→↑↓]/g,' ').replace(/\n/g,'。 '); }
function speak(text,force){
  if(!force && !S.autoSpeak) return; if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(cleanSpeech(text)); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate = S.textSpeed==='slow'?0.8:0.95; speechSynthesis.speak(u); }catch(e){}
}

let keyNav=null, kbdMode=false;
let screenNow='title', waiter=null, keyChoice=null, lastSpoken='', busy=false, modalOpen=false;
const dlgEl = $('#dlg');
function box(){ return screenNow==='battle' ? $('#bmsg') : dlgEl; }
function closeDlg(){ dlgEl.classList.remove('show'); dlgEl.querySelector('.msg-choices').innerHTML=''; }
function setMsg(html,spoken){
  const b=box(); if(b===dlgEl) b.classList.add('show');
  b.querySelector('.msg-text').innerHTML=html; b.querySelector('.msg-next').classList.remove('on');
  if(spoken!=null){ lastSpoken=spoken; speak(spoken); }
}
/* say(ひょうじ, よみあげ, じどうで すすむ ミリびょう) */
function say(text,spoken,auto){
  if(spoken==null) spoken=text;
  return new Promise(resolve=>{
    const b=box(); if(b===dlgEl){ b.classList.add('show'); b.querySelector('.msg-choices').innerHTML=''; }
    const tEl=b.querySelector('.msg-text'), nx=b.querySelector('.msg-next');
    nx.classList.remove('on'); lastSpoken=spoken; speak(spoken);
    const spd={slow:55,normal:24,fast:0}[S.textSpeed] ?? 24;
    let done=false, i=0, closed=false, timer=null;
    const end=()=>{ if(closed) return; closed=true; clearTimeout(timer); waiter=null; resolve(); };
    const fin=()=>{ done=true; tEl.innerHTML=esc(text); nx.classList.add('on'); if(auto) timer=setTimeout(end,auto); };
    if(!spd) fin(); else { tEl.innerHTML=''; const tick=()=>{ if(done) return; i++; tEl.innerHTML=esc(text.slice(0,i)); if(i>=text.length) fin(); else setTimeout(tick,spd); }; tick(); }
    waiter=()=>{ if(!done){ fin(); return; } SFX.select(); end(); };
  });
}
async function talk(lines){ for(const l of lines) await say(l); }
function choices(container,items,cols){
  return new Promise(resolve=>{
    let done=false;
    container.innerHTML=''; container.style.setProperty('--cols', cols||2);
    const btns=items.map((it,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='cbtn '+(it.cls||''); b.innerHTML=it.html;
      if(it.disabled) b.disabled=true;
      if(it.say){ b.classList.add('has-say'); const sp=document.createElement('span'); sp.className='csay'; sp.textContent='🔊'; sp.title='よみあげ'; sp.addEventListener('click',e=>{ e.stopPropagation(); speak(it.say,true); }); b.appendChild(sp); }
      b.addEventListener('click',e=>{ e.stopPropagation(); if(b.disabled||done) return; done=true; keyChoice=null; SFX.select(); resolve(i); });
      container.appendChild(b); return b;
    });
    keyChoice = i => { if(btns[i] && !btns[i].disabled) btns[i].click(); };
    btns.forEach((b,i)=>{ if(i<9) b.dataset.n=i+1; });
    const cl=cols||2; let fi=btns.findIndex(b=>!b.disabled);
    const paint=()=>btns.forEach((b,i)=>b.classList.toggle('kfocus', kbdMode && i===fi));
    keyNav = {
      move(dx,dy){ if(fi<0) return; let n=fi; const step=dy?dy*cl:dx;
        for(let t=0;t<btns.length;t++){ n+=step; if(n<0||n>=btns.length){ if(dy) return paint(); n=(n+btns.length)%btns.length; } if(!btns[n].disabled){ fi=n; break; } }
        paint(); },
      pick(){ if(fi>=0) btns[fi].click(); },
      paint,
    };
    const fin=()=>{ keyNav=null; };
    btns.forEach(b=>b.addEventListener('click',fin));
    paint();
  });
}
async function ask(text,opts,spoken){
  const b=box(); setMsg(esc(text), spoken ?? text);
  const c = b===dlgEl ? b.querySelector('.msg-choices') : $('#bcmd');
  const long = opts.some(o=>String(o).replace(/<[^>]*>/g,'').length>12);
  const i = await choices(c, opts.map(o=>({html:o})), long?1:Math.min(opts.length,3));
  if(b===dlgEl) c.innerHTML='';
  return i;
}
document.querySelectorAll('.msgbox').forEach(el=>{
  el.addEventListener('click',()=>{ if(waiter) waiter(); });
  el.querySelector('.msg-say').addEventListener('click',e=>{ e.stopPropagation(); speak(lastSpoken,true); });
});

  }
  stepping=true; mv={fx:G.x,fy:G.y,t0:performance.now()}; G.x=nx; G.y=ny;

async function afterStep(){

  if(w){ pathQ=[]; holdDir=null;

}
function sees(o){
  const [dx,dy]=DIRV[o.d];
  for(let i=1;i<=o.sight;i++){
    const tx=o.x+dx*i, ty=o.y+dy*i;

function bfs(goals){ // goals: Set of "x,y"
  const m=curMap(), key=(x,y)=>x+','+y, prev=new Map([[key(G.x,G.y),null]]), q=[[G.x,G.y]];
  let found=null;
  if(goals.has(key(G.x,G.y))) return [];
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(prev.has(k)||blocked(nx,ny)) continue;
      const special = doorAt(nx,ny) || objsHere().some(o=>o.t==='warp'&&o.x===nx&&o.y===ny);
      if(special && !goals.has(k)) continue;
      prev.set(k,[x,y]); if(goals.has(k)){ found=[nx,ny]; q.length=0; break; } q.push([nx,ny]);
    }
  }
  if(!found) return null;
  const path=[]; let cur=found;
  while(cur && !(cur[0]===G.x&&cur[1]===G.y)){ path.unshift(cur); cur=prev.get(key(cur[0],cur[1])); }
  return path;
}
async function walkPath(path, after){
  pathQ=path; walkGoal=after||null; if(walkLoop) return; walkLoop=true;
  while(pathQ.length && canMove()){
    if(stepping){ await sleep(30); continue; }
    const [x,y]=pathQ.shift();
    if(Math.abs(x-G.x)+Math.abs(y-G.y)!==1){ pathQ=[]; break; }
    const ok=await tryStep(x-G.x,y-G.y); if(!ok){ pathQ=[]; walkGoal=null; break; }
  }
  walkLoop=false;
  if(walkGoal && canMove()){ const f=walkGoal; walkGoal=null; await f(); }
  walkGoal=null;
}

      const s=getComputedStyle(el);
      if(/auto|scroll/.test(s.overflowY) && el.scrollHeight>el.clientHeight+1) return true;
      if(/auto|scroll/.test(s.overflowX) && el.scrollWidth>el.clientWidth+1) return true;
    }
    return false;
  };
  document.addEventListener('touchmove', e=>{ if(e.touches.length>1 || !canScroll(e.target)) e.preventDefault(); }, {passive:false});
  ['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
  addEventListener('scroll', ()=>{ if(scrollX||scrollY) scrollTo(0,0); });
})();

async function interact(o){
  if(!canMove()) return;
  if(o.t==='trainer' && !G.beaten[o.id]) return engageTrainer(o);
  busy=true;
  try{
    if(o.t==='sign'){ await say(signText(o)); }
    else if(o.ev && EVENTS[o.ev]){ await EVENTS[o.ev](o); }
    else if(o.t==='npc' && o.gift){ await giftNpc(o); }
    else if(o.t==='npc' && o.ferry){ await ferryNpc(o); }
    else if(o.t==='npc' && o.stamp){ await stampNpc(o); }
    else if(o.t==='npc'){ await talk(o.text.map(l=>`${o.e}：\n${l}`)); }
    else if(o.t==='trainer'){ await say(`${o.e} ${o.name}：\n${o.after}`); }
    else if(o.t==='chest'){
      if(G.chests[o.id]) await say('たからばこは からっぽ だ。');
      else if(o.mon){ G.chests[o.id]=true; SFX.catch();
        await say(`たからばこを あけた！\nなんと、 カンジモンの 「${o.mon}」が でて きた！`, `たからばこを あけた！ なんと、 カンジモンが でて きた！`);
        await joinMon(o.mon, o.lv); }
      else { G.chests[o.id]=true; G.items[o.item]=(G.items[o.item]||0)+o.n; SFX.catch(); const it=ITEMS[o.item];
        await say(`たからばこを あけた！\n${it.icon} ${it.name} を ${o.n}こ てにいれた！`); save(); }
    }
    else if(o.t==='gate'){ await gateQuiz(o); }
  } finally { closeDlg(); busy=false; renderHUD(); }
}

async function dlgQuiz(q){
  let html, ans, opts, spoken, kanjiOpts=false, recKind='k', recKey='', sayOf=null, explain='';
  if(q.t==='bu1'){ // ぶしゅ → 漢字
    const ids=Object.keys(BUSHU).filter(id=>buKanji(id).some(k=>SP[k].g<=3));
    const id=(q.bu&&BUSHU[q.bu])?q.bu:rnd(ids), b=BUSHU[id];
    ans=rnd(buKanji(id).filter(k=>SP[k].g<=3));
    const others=SPL.filter(s=>s.g<=3 && buOf(s.k) && buOf(s.k)!==id).map(s=>s.k);
    opts=shuffle([ans,...shuffle(others).slice(0,2)]); kanjiOpts=true; recKind='b'; recKey=ans;
    html=`<div class="quiz"><div class="qbig">${b.c}</div><div class="qq">「${b.name}」の なかまの かんじは どれ？</div></div>`; spoken=`${b.name}の なかまの かんじは どれ？`;
    explain=`「${ans}」に 「${b.c}（${b.name}）」が ついて いるね。`;
  }
  else if(q.t==='bu2'){ // 漢字 → ぶしゅ
    const id=buOf(q.k), b=BUSHU[id]; ans=buLabel(id);
    opts=shuffle([ans,...shuffle(Object.keys(BUSHU).filter(x=>x!==id)).slice(0,2).map(buLabel)]); recKind='b'; recKey=q.k; sayOf=buName;
    html=`<div class="quiz"><div class="qbig">${q.k}</div><div class="qq">この かんじの ぶしゅは どれ？</div></div>`; spoken='この かんじの ぶしゅは どれ？';
    explain=`「${q.k}」の ぶしゅは 「${b.c}（${b.name}）」。`;
  }
  else if(q.t==='koto'){ ans=q.a; opts=shuffle(q.opts.slice()); recKind='w'; recKey=q.head.replace(/ /g,'')+q.a.replace(/ /g,'');
    html=`<div class="quiz"><div class="qbig">${q.head}…</div><div class="qq">この ことわざの つづきは どれ？</div></div>`; spoken=`${q.r}。 この ことわざの つづきは どれ？`;
    explain=`「${q.head.replace(/ /g,'')}${q.a.replace(/ /g,'')}」が ただしい ことわざだよ。`; }
  else if(q.t==='yomi'){ const s=SP[q.k]; ans=s.yomi; opts=shuffle([ans,...distract(ans,ALLYOMI,validReadings(s),2)]); recKey=q.k;
    html=`<div class="quiz"><div class="qbig">${q.k}</div><div class="qq">この かんじの よみは どれ？</div></div>`; spoken='この かんじの よみは どれ？'; }
  else if(q.t==='kanji'){ ans=q.a; opts=shuffle(q.opts.slice()); kanjiOpts=true; recKey=q.a;
    html=`<div class="quiz"><div class="qbig kana">${q.r}</div><div class="qq">は どの かんじ？</div></div>`; spoken=`${q.r} は どの かんじ？`; }
  else { ans=q.a; opts=shuffle(q.opts.slice()); kanjiOpts=true; recKind='w'; recKey=q.word.replace('□',q.a);
    html=`<div class="quiz"><div class="qbig">${q.word}</div><div class="qq">（${q.r}）の □ に はいる かんじは どれ？</div></div>`; spoken=`${q.r}。 しかくに はいる かんじは どれ？`; }
  box(); setMsg(html, spoken);
  const c=dlgEl.querySelector('.msg-choices');
  const i=await choices(c, opts.map(x=>({html:`<span class="qopt ${kanjiOpts?'qk':''}">${x}</span>`, say: kanjiOpts?null:(sayOf?sayOf(x):x)})), 3);
  const ok=opts[i]===ans;
  [...c.children].forEach((b,j)=>{ b.disabled=true; if(opts[j]===ans) b.classList.add('correct'); else if(j===i) b.classList.add('wrong'); });
  ok?SFX.ok():SFX.ng(); rec(recKind,recKey,ok);
  await sleep(900); c.innerHTML='';
  return {ok, ans, explain};
}
async function gateQuiz(o){
  await say(o.kind==='door' ? 'いしの とびらに もじが かいてある。\nもんだいに こたえると ひらく みたい！' : 'あなが あいていて すすめない！\nかんばんに もんだいが かいてある。');
  const {ok, ans, explain}=await dlgQuiz(o.q);

  if(ok){ G.gates[o.id]=true; SFX.door(); await say(o.kind==='door'?'せいかい！ とびらが ひらいた！':'せいかい！ はしが かかった！'); save(); }
  else await say(`おしい！ こたえは 「${ans}」 だよ。\nもう いちど しらべて みてね。`);
}

  }
  await endBattle(result);

/* あいてとの あいしょう（こうげき と まもり） */
function matchup(k, fk){
  const mt=SP[k].type, ft=SP[fk].type;
  const atk=(EFF[mt]||{})[ft]||1, def=(EFF[ft]||{})[mt]||1;
  const sc=(atk>1)+(def<1)-(atk<1)-(def>1);
  const parts=[];
  if(atk>1) parts.push('こうげき ばつぐん'); else if(atk<1) parts.push('こうげき いまひとつ');
  if(def>1) parts.push('あいての こうげきが いたい'); else if(def<1) parts.push('あいての こうげきに つよい');
  const [mk,word,cls] = sc>=2?['◎','とても つよい','g2'] : sc===1?['○','つよい','g1'] : sc===0?['－','ふつう','g0'] : sc===-1?['△','にがて','b1'] : ['✕','とても にがて','b2'];
  return {sc, mk, word, cls, parts, html:`<span class="mu ${cls}">${mk} ${word}${parts.length?`<small>${parts.join('・')}</small>`:''}</span>`,
    say:`${word}${parts.length?'。 '+parts.join('、 '):''}`};
}

function distract(ans,pool,ex,n){
  const exs=new Set([ans,...(ex||[])]);
  const c=shuffle([...new Set(pool)].filter(x=>!exs.has(x)));
  c.sort((a,b)=>Math.abs(a.length-ans.length)-Math.abs(b.length-ans.length));
  return shuffle(c.slice(0,8)).slice(0,n);
}

function calcDmg(a,d,mv,mult){
  const A=st(a).atk, D=st(d).def;
  const eff=(EFF[SP[a.k].type]||{})[SP[d.k].type]||1;
  let v=Math.floor(((2*a.lv/5+2)*mv.pow*A/D)/50)+2;
  v=Math.max(1,Math.round(v*eff*mult*(0.88+Math.random()*0.12)));
  return {dmg:v, eff};
}

async function gainExp(amt){ // なかま ぜんいんが おなじだけ もらう

  team.forEach(m=>m.exp+=amt); renderInfos();
  if(team.length>1) await say(`なかま みんなが けいけんちを ${amt} もらった！`, `なかま みんなが けいけんちを ${amt} もらった！`, 1100);

    const from=m.lv;
    while(m.exp>=needExp(m.lv) && m.lv<50){

    }
  }
}

  if(!ok){ await say(`おしい！ 「${f.k}」は 「${s.yomi}」と よむよ。\n${it.name}は なげられなかった…`, `おしい！ ${s.yomi} と よむよ。`); clearCmd(); return false; }
  await say(`せいかい！ 「${s.yomi}」！\nそれっ、 ${it.name}！`, `せいかい！ ${s.yomi}！ それっ！`, 800);
  clearCmd();
  const rate=Math.min(.97, 0.5+0.45*(1-f.hp/st(f).hp)+(it.bonus||0)+(B.sr?.15:0)), success=Math.random()<rate;
  await ballAnim(success, kind==='sball');
  if(!success){ await say('あっ！ ボールから でて きちゃった！\nボールは もどって きたよ。 もうすこし よわらせると つかまえやすいよ。', 'あっ！ ボールから でて きちゃった！ ボールは もどって きたよ。'); return false; }
  return await catchFoe(kind);
}
async function endBattle(result){
  if(result==='lose') await say(B.wild ? 'みんな つかれちゃった…' : 'まけちゃった… でも だいじょうぶ！');
  if(B.me) G.lastMon=B.me.id;
  resetBall(); clearCmd();
  show('map');
  if(result==='lose'){
    await respawn();
    await say('カンジセンターで やすんだよ。\nみんな げんきに なった！ また がんばろう！');
  }
  for(const m of [...G.party]){ while(SP[m.k].evo && m.lv>=SP[m.k].evo.lv) await evolve(m); }
  closeDlg(); B=null; save(); renderHUD();
}
async function evolve(m){
  const from=m.k, to=SP[from].evo.to;
  openModal(`<div class="evo"><div id="evo-spr">${sprite(from,200,{bob:true})}</div></div>`);
  await say(`おや…？ ${from} の ようすが…！`, `おや？ ${Y(from)} の ようすが…！`);
  const el=$('#evo-spr');
  for(let i=0;i<10;i++){ el.innerHTML=sprite(i%2?to:from,200); el.classList.toggle('flashw',i%2===0); SFX.shake(); await sleep(120+i*25); }
  el.classList.remove('flashw'); el.innerHTML=sprite(to,200,{bob:true});
  const before=st(m).hp; m.k=to; m.hp=Math.min(st(m).hp, m.hp+st(m).hp-before); dexCatch(to); SFX.lvup();
  await say(`おめでとう！\n${from} は ${to} に しんか した！`, `おめでとう！ ${Y(from)} は ${Y(to)} に しんか した！`);
  await say(`「${to}」は 「${Y(to)}」と よむよ。`, `${Y(to)} と よむよ。`);
  normMon(m);
  const add=SP[to].moves.filter(v=>!m.mv.some(x=>x.w===v.w)).map(v=>({w:v.w,r:v.r,pow:v.pow}));
  if(add.length){
    m.mv.push(...add); m.used=[];
    const rest=add.filter(v=>{ if(m.eq.length<MAX_EQ){ m.eq.push(v.w); return false; } return true; });
    SFX.lvup();
    await say(`${to} は あたらしい わざ ${add.map(v=>`「${v.w}」`).join('')} を おぼえた！${rest.length?`\nつかう わざは 「なかま」の 「ようす」で えらべるよ。`:''}`, `${Y(to)} は あたらしい わざを おぼえた！`);
  }
  closeModal(); save();
}

const monCard=(m,w,i)=>`<button class="card ${m.hp<=0?'faint':''}" data-w="${w}" data-i="${i}">${w==='p'&&i===0?'<span class="lead">せんとう</span>':''}${SP[m.k].leg?'<span class="rarec leg">👑でんせつ</span>':SP[m.k].sr?'<span class="rarec sr">💎スーパーレア</span>':SP[m.k].rare?'<span class="rarec">✨レア</span>':''}${sprite(m.k,86)}<div class="cname"><ruby>${m.k}<rt>${Y(m.k)}</rt></ruby></div><div>Lv${m.lv}</div>${SP[m.k].evo?`<div class="cevo">⬆ Lv${SP[m.k].evo.lv}で しんか</div>`:''}<span class="hpo sm"><span class="hpi ${hpc(m)}" style="width:${hpPct(m)}%"></span></span></button>`;

function pickMoves(m){
  normMon(m); let sel=[...m.eq]; const need=Math.min(MAX_EQ, m.mv.length); let warn='';
  const draw=()=>{
    openModal(`<div class="mhead"><h2>⚔️ ${m.k} の つかう わざを えらぶ</h2><button class="sbtn" data-back>↩ もどる</button></div>
      <p class="muted">バトルで つかう わざを ${need}つ えらんでね。（いま ${sel.length}つ） タッチ すると えらぶ・はずすが できるよ。</p>${warn?`<p class="mvwarn">${warn}</p>`:''}
      <div class="mvpick">${m.mv.map((v,i)=>`<button class="mvbtn ${sel.includes(v.w)?'on':''} ${v.sp?'sp':''}" data-i="${i}">${sel.includes(v.w)?'✅':'⬜'} ${spMark(v)}<ruby>${v.w}<rt>${v.r}</rt></ruby></button>`).join('')}</div>
      <div class="dbtns"><button class="sbtn" data-ok ${sel.length===need?'':'disabled'}>けってい</button></div>`);
    $('#mpanel [data-back]').onclick=()=>monDetail(m);

function monDetail(m){
  const s=SP[m.k], inP=G.party.includes(m), idx=G.party.indexOf(m), btns=[];
  if(inP&&idx>0) btns.push(['lead','⭐ せんとうに する']);
  if(inP&&G.party.length>1) btns.push(['dep','📦 ボックスに あずける']);
  if(!inP&&G.party.length<6) btns.push(['wd','🐾 なかまに いれる']);
  if(!inP) btns.push(['swap','🔄 なかまと こうたい']);
  if(inP&&G.box.length) btns.push(['swap','🔄 ボックスの カンジモンと こうたい']);
  normMon(m); if(m.mv.length>MAX_EQ) btns.push(['moves','⚔️ つかう わざを えらぶ']);
  openModal(`<div class="mhead"><h2>${s.k} の ようす</h2><button class="sbtn" data-back>↩ もどる</button></div>${detailBody(s,m)}
    <div class="dbtns">${btns.map(([a,l])=>`<button class="sbtn" data-a="${a}">${l}</button>`).join('')}</div>`);
  $('#mpanel [data-back]').onclick=openParty;
  $('#mpanel').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='swap') return swapPick(m, inP);
    if(a==='moves') return pickMoves(m);
    if(a==='lead'){ G.party.splice(idx,1); G.party.unshift(m); }
    if(a==='dep'){ G.party.splice(idx,1); G.box.push(m); }
    if(a==='wd'){ G.box.splice(G.box.indexOf(m),1); G.party.push(m); }
    SFX.select(); save(); openParty();
  });
  speak(`${s.yomi}。 ${s.desc}`);
}

const owned = () => [...G.party,...G.box];
function canFuse(r){ const a=owned().filter(m=>m.k===r[0]); if(r[0]===r[1]) return a.length>=2; return a.length>=1 && owned().some(m=>m.k===r[1]); }
function pickBest(k,except){ return owned().filter(m=>m.k===k&&m!==except).sort((x,y)=>y.lv-x.lv)[0]; }
function rmMon(m){ let i=G.party.indexOf(m); if(i>=0) G.party.splice(i,1); i=G.box.indexOf(m); if(i>=0) G.box.splice(i,1); }
function partHTML(k){ const d=G.dex[k]; return `<div class="rpart">${d===2?sprite(k,64):`<div class="rq" style="color:#555;font-family:var(--kfont)">${k}</div>`}<span>${d===2?Y(k):'？'}</span></div>`; }
async function enterShrine(){ busy=true; await say('⛩️ がったいの ほこら：\n2ひきの カンジモンを くみあわせると、 あたらしい かんじが うまれるよ。'); closeDlg(); busy=false; renderShrine(); }
function renderShrine(){
  openModal(`<div class="mhead"><h2>⛩️ がったいの ほこら</h2><button class="sbtn" data-close>とじる</button></div>
  <p class="muted">ざいりょうの 2ひきが そろうと 「がったい！」が おせるよ。 2ひきは そのまま のこって、 あたらしい カンジモンが 1ぴき ふえるよ。</p>
  ${RECIPES.map((r,i)=>[r,i]).sort((x,y)=>(SP[y[0][2]].g===curMap().grade)-(SP[x[0][2]].g===curMap().grade)).map(([r,i])=>{ const got=G.dex[r[2]]===2;
    return `<div class="rcp">${partHTML(r[0])}<span class="op">＋</span>${partHTML(r[1])}<span class="op">＝</span>
     <div class="rpart">${got?sprite(r[2],64):'<div class="rq">？</div>'}<span>${got?`<span class="rk">${r[2]}</span>`:'なにかな？'}</span>${got&&SP[r[2]].g>1?`<span class="gr">${SP[r[2]].g}ねんの かんじ</span>`:''}</div>
     <button class="sbtn" data-r="${i}" ${canFuse(r)?'':'disabled'}>✨ がったい！</button></div>`; }).join('')}`);
  $('#mpanel').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>doFuse(RECIPES[+b.dataset.r]));
}
async function doFuse(r){
  if(busy) return; busy=true;
  const a=pickBest(r[0]), b=pickBest(r[1],a);
  const yes=await ask(`${a.k}（Lv${a.lv}） と ${b.k}（Lv${b.lv}） を がったい させる？\n2ひきは そのまま のこるよ。`,['はい','やめる'], `${Y(a.k)} と ${Y(b.k)} を がったい させる？ 2ひきは そのまま のこるよ。`);
  if(yes!==0){ closeDlg(); busy=false; return; }
  closeDlg();
  openModal(`<div class="evo fuse"><div id="fa">${sprite(a.k,150,{bob:true})}</div><div id="fb">${sprite(b.k,150,{bob:true})}</div></div>`);
  await sleep(500); SFX.enc();
  $('#fa .mon').style.transform='translateX(90px) scale(.6)'; $('#fb .mon').style.transform='translateX(-90px) scale(.6)';
  await sleep(850);
  const wrap=$('#mpanel .evo'); wrap.innerHTML=`<div id="fr" class="flashw">${sprite(r[2],210,{bob:true})}</div>`;
  await sleep(250); $('#fr').classList.remove('flashw'); SFX.lvup();
  const nm={id:G.nextId++, k:r[2], lv:Math.min(50,Math.max(a.lv,b.lv)+1), exp:0, hp:0}; nm.hp=st(nm).hp; normMon(nm);
  const toBox=G.party.length>=6; (toBox?G.box:G.party).push(nm); // ざいりょうの 2ひきは のこす
  dexCatch(r[2]); save();
  await say(`${a.k} と ${b.k} が がったい して…\n${r[2]} に なった！`, `${Y(a.k)} と ${Y(b.k)} が がったい して、 ${Y(r[2])} に なった！`);
  await say(`「${r[2]}」は 「${Y(r[2])}」と よむよ。\n${SP[r[2]].desc}`, `${Y(r[2])} と よむよ。`);
  await say(`${a.k} と ${b.k} も そのまま なかまに いるよ。${toBox?`\nなかまが いっぱい なので、 ${r[2]} は あずかりボックスに おくったよ。`:''}`, `${Y(a.k)} と ${Y(b.k)} も そのまま なかまに いるよ。`);
  closeDlg(); busy=false; renderShrine();
}

const SR_LV = {'沙':16,'理':18,'彩':18,'莉':20,'那':23,'貴':23,'龍':45,'虎':45};

const hosu = n => `${n}${[1,3,6,8,10].includes(n)?'ぽ':'ほ'}`;
async function evQ(L, text, opts, ans, spoken, good){
  for(;;){
    const os=shuffle(opts.slice()), i=await ask(L+text, os, spoken);
    if(os[i]===ans){ SFX.ok(); await say(L+'せいかい！'+(good?' '+good:'')); return; }
    SFX.ng(); await say(L+'おしい！ もう いちど かんがえて みよう。');
  }
}
async function srFx(kind){ const f=$('#fx'); f.className=''; void f.offsetWidth; f.className='lg-'+kind; SFX.alert(); await sleep(kind==='sr'?1100:1300); f.className=''; }
async function srBattle(k, fx){
  if(noAlive()){ await tiredReturn(); return 'lose'; }
  closeDlg(); await srFx(fx);
  const leg=SP[k].leg;
  return await battle({wild:true, sr:!leg, legend:leg, foes:[mkW(k,SR_LV[k])], bg: leg ? (k==='龍'?'sky':'bamboo') : ''});
}
async function srAfter(k, res, again){
  if(res==='caught') return;
  if(res==='lose') return;
  await say(again);
}

function saPos(n){ const m=MAPS.route2, flag=m.objs.find(o=>o.t==='sign'&&o.flag), p=m.objs.find(o=>o.t==='pile'&&o.n===n); return {dx:p.x-flag.x, dy:p.y-flag.y}; }
function saHint(n){ const {dx,dy}=saPos(n), a=[];
  if(dy<0) a.push(`⬆ きたへ ${hosu(-dy)}`); if(dy>0) a.push(`⬇ みなみへ ${hosu(dy)}`);
  if(dx>0) a.push(`➡ ひがしへ ${hosu(dx)}`); if(dx<0) a.push(`⬅ にしへ ${hosu(-dx)}`);
  return `🚩から ${a.join('、 ')} の すなやま`; }
function saHintSay(n){ return saHint(n).replace(/[⬆⬇➡⬅🚩]/g,'').replace('から','はたから'); }

  $('#end-btns').classList.add('on');
}
function renderEnd(){
  const all=[...G.party,...G.box];
  $('#end-mons').innerHTML=G.party.map(m=>`<div class="end-mon">${sprite(m.k,90,{bob:true})}<span><ruby>${m.k}<rt>${Y(m.k)}</rt></ruby> Lv${m.lv}</span></div>`).join('');
  const tot=g=>SPL.filter(s=>s.g===g).length;
  const st=Object.keys(BUSHU).filter(id=>BUSHU[id].island&&G.flags['stamp_'+id]).length;
  $('#end-card').innerHTML=`<table>
   <tr><td>🏅 バッジ</td><td class="n">${'🏅'.repeat(G.badges)} ${G.badges}こ</td></tr>
   <tr><td>📖 1ねんの かんじ</td><td class="n">${caughtCount(1)} / ${tot(1)}</td></tr>
   <tr><td>📖 2ねんの かんじ</td><td class="n">${caughtCount(2)} / ${tot(2)}</td></tr>
   <tr><td>📖 3ねんの かんじ</td><td class="n">${caughtCount(3)} / ${tot(3)}</td></tr>
   <tr><td>✨ 4ねん〜の かんじ（おまけ）</td><td class="n">${SPL.filter(s=>s.g>=4&&!s.extra&&G.dex[s.k]===2).length}</td></tr>
   <tr><td>💎 スーパーレア</td><td class="n">${SPL.filter(s=>s.sr&&G.dex[s.k]===2).length} / ${SPL.filter(s=>s.sr).length}</td></tr>
   <tr><td>🐾 なかまの かず</td><td class="n">${all.length}ひき</td></tr>
   <tr><td>🧩 しまの スタンプ</td><td class="n">${st} / 4</td></tr>
  </table>`;
  $('#end-btns').classList.remove('on'); $('#end-note').textContent='';
  $('#end-stars').innerHTML=Array.from({length:22},(_,i)=>`<span style="left:${(i*47)%100}%;animation-duration:${6+(i*7)%6}s;animation-delay:${-(i*1.3)%8}s">${['⭐','✨','🎉','🌟'][i%4]}</span>`).join('');
}
$('#end-save').onclick=()=>{ ac(); if(busy||!G) return; downloadSave(G); $('#end-note').textContent='✅ かきだしたよ。 せんせいに 「ダウンロード」の ファイルを わたしてね。'; speak('かきだしたよ。 せんせいに ファイルを わたしてね。'); };
$('#end-cont').onclick=()=>{ ac(); if(busy) return; fade(async()=>{ show('map'); showBanner(); }); };

/* =====================================================================
   セーブデータの かきだし・よみこみ（4ねんの ゲームへ ひきつぐ）
   ファイルの なかみは src/SAVE_FORMAT.md を みてください
   ===================================================================== */
const SAVE_APP='kanjimon', SAVE_FMT=1, SAVE_PART='1-3';
const pad2=n=>String(n).padStart(2,'0');
function localStamp(d=new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function saveSum(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,'0'); }
function svStats(g){
  const c=n=>SPL.filter(s=>(n===4?(s.g>=4&&!s.extra):n===5?(s.sr||s.leg):s.g===n)&&g.dex[s.k]===2).length;
  return {badges:g.badges, clear3:!!(g.flags&&g.flags.clear3), caught:{g1:c(1),g2:c(2),g3:c(3),g4plus:c(4),special:c(5)},
    mons:g.party.length+g.box.length, money:g.money, party:g.party.map(m=>({k:m.k,lv:m.lv}))};
}
function makeExport(g){
  const game=JSON.parse(JSON.stringify(g));
  return {app:SAVE_APP, kind:'save', format:SAVE_FMT, from:SAVE_PART, title:'カンジモン 1・2・3ねん',
    exported:localStamp(), name:game.pname||'', summary:svStats(game), game, record:REC, sum:saveSum(JSON.stringify(game))};
}
function saveFileName(d){
  const t=d.exported.replace(/[-:]/g,'').replace('T','_').slice(0,13);
  const nm=(d.name||'').replace(/[\\/:*?"<>|\s]/g,'');
  return `カンジモン1-3_${nm?nm+'_':''}${d.summary.clear3?'3ねんクリア':'バッジ'+d.summary.badges}_${t}.json`;
}
function downloadSave(g){
  const d=makeExport(g);
  const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=saveFileName(d);
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  g.exportedAt=d.exported; store.set(SAVE_KEY,g);
  return d;
}
function parseSave(txt){
  let d; try{ d=JSON.parse(String(txt||'').replace(/^\uFEFF/,'')); }catch(e){ return {err:'ファイルが よめなかったよ。'}; }
  if(!d||d.app!==SAVE_APP||d.kind!=='save'||!d.game) return {err:'カンジモンの セーブデータでは ないみたい。'};
  if(d.from&&d.from!==SAVE_PART) return {err:`これは べつの ゲーム（${d.from}ねん）の データだよ。`};
  if(d.format>SAVE_FMT) return {err:'あたらしすぎる データで、 よめなかったよ。'};
  if(d.sum&&d.sum!==saveSum(JSON.stringify(d.game))) return {err:'データが こわれて いるみたい。'};
  if(!Array.isArray(d.game.party)||!d.game.party.length) return {err:'なかまが いない データだよ。'};
  return {d};
}
function svSummaryText(g){
  if(!g) return 'まだ データが ないよ。';
  const s=svStats(g);
  return `${s.clear3?'⭐3ねんクリア　':''}🏅バッジ ${s.badges}こ　📖つかまえた かんじ ${s.caught.g1+s.caught.g2+s.caught.g3+s.caught.g4plus}　🐾なかま ${s.mons}ひき`;
}
async function confirmImport(d,teacher){
  const s=d.summary||svStats(d.game);
  const msg=`${d.name?d.name+' さんの ':''}データ（${(d.exported||'').slice(0,10)}）\n${s.clear3?'⭐3ねんクリア ':''}バッジ ${s.badges}こ・なかま ${s.mons}ひき\n${loadGame()?'いまの データと いれかえる？':'この データを よみこむ？'}`;
  let yes;
  if(teacher) yes=confirm(msg.replace(/\n/g,' ／ ')+'\n（いまのデータは消えます）');
  else { busy=true; yes=(await ask(msg,[loadGame()?'いれかえる':'よみこむ','やめる']))===0; closeDlg(); busy=false; }
  if(!yes) return false;
  const old=store.get(SAVE_KEY);
  store.set(SAVE_KEY,d.game);
  if(!loadGame()){ if(old) store.set(SAVE_KEY,old); else store.del(SAVE_KEY); return false; }
  if(d.record&&typeof d.record==='object'){ REC=Object.assign({k:{},w:{}},d.record); store.set(REC_KEY,REC); }
  G=null;
  return true;
}
function pickSaveFile(done){
  const inp=$('#save-file'); inp.value='';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async ()=>{ const r=parseSave(rd.result), inT=$('#t-svmsg');
      if(r.err){ if(inT){ inT.textContent=r.err; inT.classList.add('bad'); } else svMsg(r.err,true); return; }
      const ok=await confirmImport(r.d,!!inT);
      if(ok&&!inT){ renderTitle(); openSaveData('✅ よみこんだよ！ 「つづきから」で あそべるよ。'); }
      done&&done(ok);
    };
    rd.readAsText(f,'utf-8');
  };
  inp.click();
}
function svMsg(t,bad){ const m=$('#sv-msg'); if(!m) return; m.textContent=t; m.classList.toggle('bad',!!bad); speak(t); }
function openSaveData(note){
  const g=loadGame();
  openModal(`<div class="mhead"><h2>💾 セーブデータ</h2><button class="sbtn" data-close>とじる</button></div>
   <div class="svcard"><b>いまの データ</b><br>${svSummaryText(g)}</div>
   <div class="svbig">
    <button class="sbtn" id="sv-exp" ${g?'':'disabled'}>💾 かきだす<small>いまの データを ファイルに するよ。 4ねんの ゲームに もっていけるよ。</small></button>
    <button class="sbtn" id="sv-imp">📂 よみこむ<small>かきだした ファイルから、 データを もどすよ。</small></button>
   </div>
   <p class="svmsg" id="sv-msg">${note||''}</p>
   <p class="tnote" style="text-align:center">かきだした ファイルは 「ダウンロード」に はいるよ。 わからない ときは せんせいに きいてね。</p>`);
  $('#sv-exp').onclick=()=>{ const g2=loadGame(); if(!g2) return; downloadSave(g2); svMsg('✅ かきだしたよ。 「ダウンロード」に ファイルが できたよ。'); };
  $('#sv-imp').onclick=()=>pickSaveFile();
  if(note) speak(note);
}

/* =====================================================================
   せんせい用の 設定
   ===================================================================== */
function openTeacher(){
  const radio=(name,opts,cur)=>opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${String(cur)===String(v)?'checked':''}>${l}</label>`).join('');
  const rows=(tab,isK)=>{
    const ent=Object.entries(REC[tab]||{}).sort((a,b)=>b[1][1]-a[1][1]||b[1][0]-a[1][0]);
    if(!ent.length) return '<p class="tnote">まだ記録がありません。</p>';
    return `<div class="rwrap"><table class="rtable"><tr><th>${isK?'漢字':'ことば'}</th><th>読み</th>${isK?'<th>学年</th>':''}<th>正解</th><th>まちがい</th></tr>${ent.map(([k,[o,n]])=>{
      const yomi = isK ? Y(k) : (SPL.flatMap(s=>[...s.moves,...s.sps]).find(m=>m.w===k)||{}).r||'';
      return `<tr><td class="k">${k}</td><td>${yomi}</td>${isK?`<td>${SP[k]?SP[k].g:''}</td>`:''}<td>${o}</td><td class="${n?'bad':''}">${n}</td></tr>`; }).join('')}</table></div>`;
  };
  openModal(`<div class="mhead"><h2>先生用の設定</h2><button class="sbtn" data-close>とじる</button></div>
   <div class="tset"><h3>進めるエリアの上限（学年）</h3>${radio('ma',[1,2,3].map(g=>[g,g+'年まで']),Math.min(3,S.maxArea))}
     <p class="tnote">このゲームは1〜3年のエリアで1本です。ジム3に勝つとエンディングになります。4年からは別のゲームで、ここで書き出したセーブデータを読みこんで続けます。</p></div>
   <div class="tset"><h3>読み上げ（自動）</h3>${radio('sp',[['1','する'],['0','しない']],S.autoSpeak?1:0)}<p class="tnote">しないにしても、🔊ボタンでいつでも読み上げます。</p></div>
   <div class="tset"><h3>効果音</h3>${radio('sf',[['1','鳴らす'],['0','鳴らさない']],S.sfx?1:0)}</div>
   <div class="tset"><h3>BGM（おんがく）</h3>${radio('bg',[['2','ふつう'],['1','小さめ'],['0','鳴らさない']],S.bgm)}<p class="tnote">読み上げのあいだは、BGMが自動で小さくなります。子どもも「🎵 おんがく」ボタンでオン・オフできます。</p></div>
   <div class="tset"><h3>文字の出る速さ</h3>${radio('ts',[['slow','ゆっくり'],['normal','ふつう'],['fast','すぐ全部']],S.textSpeed)}</div>
   <div class="tset"><h3>わざを使うときのクイズ</h3>${radio('mq',[['1','あり'],['0','なし']],S.moveQuiz?1:0)}
     <p class="tnote">出す問題の種類（チェックしたものからランダムに出ます。1つもないときは「読み」）</p>
     ${QTL.map(([v,,l])=>`<label><input type="checkbox" name="qt" value="${v}" ${(S.qTypes||[]).includes(v)?'checked':''}>${l}</label>`).join('')}</div>
   <div class="tset"><h3>トレーナー戦：相手のわざの問題</h3>${radio('gq',[['1','あり（正解するとダメージを減らす・よける）'],['0','なし']],S.guardQuiz?1:0)}</div>
   <div class="tset"><h3>学習の記録（まちがいが多い順）</h3><h3 style="font-size:17px">漢字の読み（ボール・とびら）</h3>${rows('k',true)}<h3 style="font-size:17px">ことばの読み（わざ・はし）</h3>${rows('w',false)}<h3 style="font-size:17px">ことばの意味</h3>${rows('m',false)}<h3 style="font-size:17px">漢字の画数</h3>${rows('s',true)}<h3 style="font-size:17px">読みから熟語をえらぶ</h3>${rows('c',false)}<h3 style="font-size:17px">あなうめ（□に入る漢字）</h3>${rows('a',false)}<h3 style="font-size:17px">部首（ふね・とびら・わざ）</h3>${rows('b',true)}
     <div class="dbtns"><button class="sbtn small" id="t-rrec">学習の記録をリセット</button></div></div>
   <div class="tset"><h3>ゲームのデータ</h3><p class="tnote">この端末のブラウザに自動で保存されています。</p>
     <p>${svSummaryText(G||loadGame())}</p>
     <label>子どもの名前（書き出すファイル名に入ります・空でもOK）<input type="text" id="t-pname" maxlength="12" value="${esc((G||loadGame()||{}).pname||'').replace(/"/g,'&quot;')}"></label>
     <div class="dbtns"><button class="sbtn small" id="t-exp">💾 セーブデータを書き出す（ファイル）</button><button class="sbtn small" id="t-imp">📂 ファイルから読みこむ</button></div>
     <p class="tnote">書き出したファイル（.json）は、ふつう「ダウンロード」フォルダに入ります。USBメモリや共有フォルダにうつして、4年のゲームや別の端末で読みこみます。学習の記録もいっしょに入ります。</p>
     <details><summary>ファイルが使えないとき（テキストでうつす）</summary>
       <div class="dbtns"><button class="sbtn small" id="t-txt">テキストで表示</button><button class="sbtn small" id="t-txtin">下のテキストを読みこむ</button></div>
       <textarea id="t-area" placeholder="ここにセーブデータのテキストが出ます。読みこむときは、ここにはりつけます。"></textarea>
     </details>
     <p class="svmsg" id="t-svmsg"></p>
     <div class="dbtns"><button class="sbtn small" id="t-rgame">ゲームのデータをリセット</button></div></div>`);
  const p=$('#mpanel');
  const bind=(name,fn)=>p.querySelectorAll(`input[name=${name}]`).forEach(r=>r.onchange=()=>{ fn(r.value); saveSet(); });
  bind('ma',v=>S.maxArea=+v); bind('sp',v=>S.autoSpeak=v==='1'); bind('sf',v=>S.sfx=v==='1'); bind('bg',v=>{ S.bgm=+v; if(S.bgm) S.bgmLast=S.bgm; ac(); }); bind('ts',v=>S.textSpeed=v); bind('mq',v=>S.moveQuiz=v==='1'); bind('gq',v=>S.guardQuiz=v==='1');
  p.querySelectorAll('input[name=qt]').forEach(c=>c.onchange=()=>{ S.qTypes=[...p.querySelectorAll('input[name=qt]:checked')].map(x=>x.value); saveSet(); });
  $('#t-rrec').onclick=()=>{ if(confirm('学習の記録を消します。よろしいですか？')){ REC={k:{},w:{}}; store.set(REC_KEY,REC); openTeacher(); } };
  $('#t-pname').onchange=()=>{ const g=G||loadGame(); if(!g) return; g.pname=$('#t-pname').value.trim(); store.set(SAVE_KEY,g); };
  const tmsg=(t,bad)=>{ const m=$('#t-svmsg'); m.textContent=t; m.classList.toggle('bad',!!bad); };
  $('#t-exp').onclick=()=>{ const g=G||loadGame(); if(!g) return tmsg('まだゲームのデータがありません。',true); g.pname=$('#t-pname').value.trim(); downloadSave(g); tmsg('書き出しました。ダウンロードフォルダを見てください。'); };
  $('#t-imp').onclick=()=>pickSaveFile(r=>{ if(r){ renderTitle(); openTeacher(); } });
  $('#t-txt').onclick=()=>{ const g=G||loadGame(); if(!g) return tmsg('まだゲームのデータがありません。',true); const a=$('#t-area'); a.value=JSON.stringify(makeExport(g)); a.select(); try{ document.execCommand('copy'); tmsg('テキストを表示して、コピーしました。'); }catch(e){ tmsg('テキストを表示しました。全部えらんでコピーしてください。'); } };
  $('#t-txtin').onclick=async ()=>{ const r=parseSave($('#t-area').value); if(r.err) return tmsg(r.err,true); if(await confirmImport(r.d,true)){ renderTitle(); openTeacher(); } };
  $('#t-rgame').onclick=()=>{ if(confirm('ゲームのデータ（なかま・ずかん・バッジ・おかね）を消します。よろしいですか？')){ store.del(SAVE_KEY); G=null; closeModal(); renderTitle(); } };
}

/* ---------- はじまり ---------- */
renderTitle();
</script>
